<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="114" fill="none" stroke="url(#neonGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Radar / Signal Wave Concentric Arcs -->
  <path d="M 120 340 A 180 180 0 0 1 392 340" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <path d="M 160 340 A 130 130 0 0 1 352 340" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.4"/>
  <path d="M 200 340 A 80 80 0 0 1 312 340" fill="none" stroke="#38bdf8" stroke-width="10" stroke-opacity="0.6"/>

  <!-- Candlestick Trend / Signal Pillars -->
  <!-- Bar 1 -->
  <rect x="136" y="270" width="28" height="70" rx="8" fill="#3b82f6" fill-opacity="0.8"/>
  <line x1="150" y1="240" x2="150" y2="360" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>

  <!-- Bar 2 -->
  <rect x="196" y="220" width="28" height="120" rx="8" fill="#38bdf8" fill-opacity="0.9"/>
  <line x1="210" y1="190" x2="210" y2="360" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Bar 3 (Dip buy - Golden DCA) -->
  <rect x="256" y="250" width="28" height="90" rx="8" fill="#f59e0b" fill-opacity="0.95"/>
  <line x1="270" y1="220" x2="270" y2="360" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Bar 4 (Breakout profit) -->
  <rect x="316" y="160" width="28" height="180" rx="8" fill="url(#accentGrad)" filter="url(#glow)"/>
  <line x1="330" y1="130" x2="330" y2="360" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <!-- Dynamic Signal Rising Trendline -->
  <path d="M 120 310 Q 200 290, 270 230 T 390 120" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="390" cy="120" r="16" fill="#10b981" stroke="#ffffff" stroke-width="5" filter="url(#glow)"/>

  <!-- Signal Pulse Beacon at apex -->
  <circle cx="390" cy="120" r="28" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Text Label DCA -->
  <text x="256" y="435" text-anchor="middle" font-family="'Outfit', 'Noto Sans KR', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">DCA SIGNAL</text>
  <text x="256" y="470" text-anchor="middle" font-family="'Outfit', 'Noto Sans KR', sans-serif" font-weight="600" font-size="22" fill="#38bdf8" letter-spacing="3">QUANT APP</text>
</svg>
